story_b_02=Para sobreviver a esta mans�o, preciso continuar escrevendo notas.##Preciso fazer tudo o que um protagonista faria e torcer para que isso seja uma daquelas hist�rias.##'Insira uma refer�ncia obscura de terror que ningu�m entende e interpreta como instru��es de alguma forma'.
